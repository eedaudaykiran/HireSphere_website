<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Employer Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4f46e5,#9333ea);
            padding:20px;
        }

        .register-container{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:20px;
            padding:40px 30px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h2{
            font-size:32px;
            color:#222;
            margin-bottom:10px;
        }

        .title p{
            color:#666;
            font-size:15px;
        }

        form p{
            margin-bottom:18px;
        }

        form label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        form input,
        form select,
        form textarea{
            width:100%;
            padding:14px;
            border:1px solid #ccc;
            border-radius:10px;
            outline:none;
            font-size:15px;
            transition:0.3s;
        }

        form input:focus,
        form select:focus,
        form textarea:focus{
            border-color:#4f46e5;
            box-shadow:0 0 8px rgba(79,70,229,0.3);
        }

        .register-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#4f46e5;
            color:#fff;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
            transition:0.3s;
        }

        .register-btn:hover{
            background:#372fcf;
        }

        .bottom-text{
            text-align:center;
            margin-top:20px;
            font-size:14px;
            color:#555;
        }

        .bottom-text a{
            text-decoration:none;
            color:#4f46e5;
            font-weight:bold;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

        @media(max-width:500px){

            .register-container{
                padding:30px 20px;
            }

            .title h2{
                font-size:26px;
            }

        }

    </style>

</head>

<body>

    <div class="register-container">

        <div class="title">

            <h2>Employer Registration</h2>

            <p>
                Create your employer account
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button
                type="submit"
                class="register-btn"
            >
                Register
            </button>

        </form>

        <div class="bottom-text">

            Already have an account?

            <a href="{% url 'employer_login_page' %}">
                Login
            </a>

        </div>

    </div>

</body>
</html>
