<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700&display=swap"
    rel="stylesheet">

<style>
    /* ── Root tokens ── */
    :root {
        --brand: #2563eb;
        --brand-dark: #1d4ed8;
        --brand-light: #eff6ff;
        --surface: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --muted: #64748b;
        --radius: 10px;
        --shadow: 0 4px 24px rgba(0, 0, 0, .08);
        --font-body: 'DM Sans', sans-serif;
        --font-head: 'Syne', sans-serif;
    }

    /* ── Card wrapper ── */
    .job-form-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 2.5rem 2rem;
        max-width: 720px;
        width: 100%;
        margin: 2rem auto;
        font-family: var(--font-body);
    }

    .job-form-card h2 {
        font-family: var(--font-head);
        font-size: 1.75rem;
        color: var(--text);
        margin: 0 0 0.25rem;
    }

    .job-form-card .subtitle {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 0 0 2rem;
    }

    /* ── Django renders <p> tags via form.as_p ── */
    .job-form-card form p {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 1.25rem;
    }

    /* Labels */
    .job-form-card form p label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
        letter-spacing: 0.01em;
    }

    /* All inputs, selects, textareas */
    .job-form-card form p input,
    .job-form-card form p select,
    .job-form-card form p textarea {
        width: 100%;
        padding: 0.65rem 0.9rem;
        font-family: var(--font-body);
        font-size: 0.95rem;
        color: var(--text);
        background: #f8fafc;
        border: 1.5px solid var(--border);
        border-radius: var(--radius);
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        box-sizing: border-box;
    }

    .job-form-card form p input:focus,
    .job-form-card form p select:focus,
    .job-form-card form p textarea:focus {
        border-color: var(--brand);
        background: var(--surface);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
    }

    /* Checkbox & radio — keep inline */
    .job-form-card form p input[type="checkbox"],
    .job-form-card form p input[type="radio"] {
        width: auto;
        accent-color: var(--brand);
        cursor: pointer;
    }

    /* File input */
    .job-form-card form p input[type="file"] {
        padding: 0.45rem 0.9rem;
        cursor: pointer;
        background: var(--brand-light);
        border-style: dashed;
    }

    /* Textarea */
    .job-form-card form p textarea {
        min-height: 110px;
        resize: vertical;
    }

    /* Error messages Django adds */
    .job-form-card form ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .job-form-card form ul.errorlist li {
        font-size: 0.8rem;
        color: #dc2626;
        margin-top: 3px;
    }

    /* ── Submit button ── */
    .job-form-card form button[type="submit"] {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 0.5rem;
        padding: 0.75rem 2rem;
        font-family: var(--font-body);
        font-size: 0.95rem;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: none;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
        box-shadow: 0 2px 8px rgba(37, 99, 235, .3);
    }

    .job-form-card form button[type="submit"]:hover {
        background: var(--brand-dark);
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(37, 99, 235, .35);
    }

    .job-form-card form button[type="submit"]:active {
        transform: translateY(0);
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
        .job-form-card {
            padding: 1.5rem 1rem;
            margin: 1rem;
            border-radius: 12px;
        }

        .job-form-card h2 {
            font-size: 1.4rem;
        }

        .job-form-card form button[type="submit"] {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<!-- ── Form card ── -->
<div class="job-form-card">
    <h2>Post a Job</h2>
    <p class="subtitle">Fill in the details below to publish your listing.</p>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">
            Post Job
        </button>
    </form>
</div>
