<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved Jobs</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fb;
            padding:40px 20px;
        }

        .saved-jobs-container{
            max-width:1200px;
            margin:auto;
        }

        .page-title{
            text-align:center;
            font-size:38px;
            margin-bottom:40px;
            color:#1e293b;
            font-weight:bold;
        }

        .jobs-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(300px, 1fr));
            gap:25px;
        }

        .job-card{
            background:#fff;
            border-radius:18px;
            padding:25px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
            transition:0.3s ease;
            border:1px solid #e2e8f0;
            position:relative;
            overflow:hidden;
        }

        .job-card:hover{
            transform:translateY(-6px);
            box-shadow:0 12px 30px rgba(0,0,0,0.12);
        }

        .job-card::before{
            content:'';
            position:absolute;
            top:0;
            left:0;
            width:100%;
            height:5px;
            background:linear-gradient(to right,#2563eb,#7c3aed);
        }

        .job-title{
            font-size:24px;
            color:#0f172a;
            margin-bottom:12px;
            font-weight:700;
        }

        .company-name{
            color:#475569;
            font-size:17px;
            margin-bottom:20px;
        }

        .job-actions{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            padding:10px 18px;
            border-radius:10px;
            font-size:15px;
            font-weight:600;
            transition:0.3s;
            display:inline-block;
        }

        .view-btn{
            background:#2563eb;
            color:white;
        }

        .view-btn:hover{
            background:#1d4ed8;
        }

        .remove-btn{
            background:#ef4444;
            color:white;
        }

        .remove-btn:hover{
            background:#dc2626;
        }

        .empty-box{
            background:white;
            padding:60px 20px;
            text-align:center;
            border-radius:18px;
            box-shadow:0 8px 20px rgba(0,0,0,0.08);
        }

        .empty-box h3{
            color:#334155;
            margin-bottom:10px;
            font-size:28px;
        }

        .empty-box p{
            color:#64748b;
            font-size:16px;
        }

        @media(max-width:768px){

            .page-title{
                font-size:30px;
            }

            .job-card{
                padding:20px;
            }

            .job-title{
                font-size:21px;
            }

            .company-name{
                font-size:15px;
            }

            .btn{
                width:100%;
                text-align:center;
            }
        }

        @media(max-width:480px){

            body{
                padding:20px 12px;
            }

            .page-title{
                font-size:26px;
            }

            .job-card{
                border-radius:14px;
            }
        }
    </style>
</head>
<body>

<div class="saved-jobs-container">

    <h2 class="page-title">Saved Jobs</h2>

    {% if saved_jobs %}
    
        <div class="jobs-grid">

            {% for item in saved_jobs %}
            
                <div class="job-card">

                    <h3 class="job-title">
                        {{ item.job.title }}
                    </h3>

                    <p class="company-name">
                        {{ item.job.company }}
                    </p>

                    <div class="job-actions">

                        <a href="{% url 'job_detail' item.job.id %}" class="btn view-btn">
                            View Job
                        </a>

                        <a href="{% url 'remove_saved_job' item.id %}" class="btn remove-btn">
                            Remove
                        </a>

                    </div>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="empty-box">

            <h3>No Saved Jobs Yet</h3>

            <p>
                Start saving jobs to view them here later.
            </p>

        </div>

    {% endif %}

</div>

</body>
</html>
